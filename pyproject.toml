[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "primus-mllog"
version = "0.1.0"
description = "MLPerf-compliant training logging utilities for ROCm Primus"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Advanced Micro Devices, Inc." }]
dependencies = [
    "mlperf-logging",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/AMD-AGI/mlperf-common"
Repository = "https://github.com/AMD-AGI/mlperf-common"

[tool.setuptools]
packages = ["primus_mllog"]
